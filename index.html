<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一般常識クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <!-- スタート画面 -->
    <section id="start-screen" class="screen">
      <h1 class="title">一般常識クイズ</h1>
      <p class="lead">全10問・4択形式のクイズです。<br>何問正解できるかチャレンジしてみましょう！</p>
      <button id="start-button" class="primary-button" type="button">スタート</button>
    </section>

    <!-- 問題画面 -->
    <section id="quiz-screen" class="screen" hidden>
      <div class="progress">
        <span id="progress-text"></span>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      </div>
      <h2 id="question-text" class="question"></h2>
      <div id="choices" class="choices"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <button id="next-button" class="primary-button" type="button" hidden>次の問題へ</button>
    </section>

    <!-- 結果画面 -->
    <section id="result-screen" class="screen" hidden>
      <h2 class="title">結果発表</h2>

      <!-- うさぎのキャラクター（data-rank で表情が変わる） -->
      <svg id="bunny" class="bunny" data-rank="good" viewBox="0 0 200 200" role="img" aria-label="うさぎのキャラクター">
        <g class="ear ear-left">
          <ellipse class="bunny-body" cx="70" cy="55" rx="18" ry="45"/>
          <ellipse class="bunny-pink" cx="70" cy="58" rx="9" ry="32"/>
        </g>
        <g class="ear ear-right">
          <ellipse class="bunny-body" cx="130" cy="55" rx="18" ry="45"/>
          <ellipse class="bunny-pink" cx="130" cy="58" rx="9" ry="32"/>
        </g>
        <ellipse class="bunny-body" cx="100" cy="130" rx="65" ry="55"/>
        <ellipse class="bunny-cheek" cx="60" cy="145" rx="11" ry="7"/>
        <ellipse class="bunny-cheek" cx="140" cy="145" rx="11" ry="7"/>
        <ellipse class="bunny-pink" cx="100" cy="133" rx="5" ry="3.5"/>

        <!-- 全問正解：にっこり笑顔＋キラキラ -->
        <g class="face face-perfect">
          <path class="bunny-stroke" d="M64 124 Q74 110 84 124"/>
          <path class="bunny-stroke" d="M116 124 Q126 110 136 124"/>
          <path class="bunny-fill" d="M88 141 Q100 164 112 141 Z"/>
          <path class="bunny-sparkle" d="M30 82 L33 92 L43 95 L33 98 L30 108 L27 98 L17 95 L27 92 Z"/>
          <path class="bunny-sparkle" d="M172 70 L174 77 L181 79 L174 81 L172 88 L170 81 L163 79 L170 77 Z"/>
        </g>

        <!-- 高得点：きらきらおめめ -->
        <g class="face face-good">
          <circle class="bunny-fill" cx="74" cy="120" r="7"/>
          <circle class="bunny-white" cx="76.5" cy="117" r="2.5"/>
          <circle class="bunny-fill" cx="126" cy="120" r="7"/>
          <circle class="bunny-white" cx="128.5" cy="117" r="2.5"/>
          <path class="bunny-stroke" d="M90 140 Q95 147 100 140 Q105 147 110 140"/>
        </g>

        <!-- 中くらい：ほのぼの -->
        <g class="face face-average">
          <circle class="bunny-fill" cx="74" cy="121" r="5"/>
          <circle class="bunny-fill" cx="126" cy="121" r="5"/>
          <path class="bunny-stroke" d="M93 144 Q100 148 107 144"/>
        </g>

        <!-- 低得点：しょんぼり＋涙 -->
        <g class="face face-low">
          <path class="bunny-stroke" d="M62 108 L82 114"/>
          <path class="bunny-stroke" d="M138 108 L118 114"/>
          <circle class="bunny-fill" cx="74" cy="122" r="6"/>
          <circle class="bunny-white" cx="76" cy="120" r="2"/>
          <circle class="bunny-fill" cx="126" cy="122" r="6"/>
          <circle class="bunny-white" cx="128" cy="120" r="2"/>
          <path class="bunny-tear" d="M70 131 Q64 141 70 145 Q76 141 70 131 Z"/>
          <path class="bunny-stroke" d="M90 151 Q100 141 110 151"/>
        </g>
      </svg>

      <p id="score-text" class="score"></p>
      <p id="result-message" class="lead"></p>
      <button id="retry-button" class="primary-button" type="button">もう一度挑戦する</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
